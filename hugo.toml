baseURL = 'https://joaomedeiros.dev/'
languageCode = 'en-us'
title = 'João Medeiros'
theme = 'typo'
enableEmoji = true

[taxonomies]
tag = 'tags'

# Google analytics code
googleAnalytics = "G-xxxxxxxxx"

[params]
# Meta description
description = "João Medeiros' Blog"

# Appearance settings
theme = 'auto'
colorPalette = 'default'
hideHeader = false

# Intro on main page, content is markdown
homeIntroTitle = 'Hi!'
homeIntroContent = """
I'm a senior backend and data infrastructure engineer based in Brazil, with 12 years building APIs and distributed systems in Python and TypeScript.
I was a founding engineer on the data team at [Warmly](https://www.warmly.ai) (acquired by HubSpot in 2026), where I built the company's MCP server
and ran the CDC pipelines, MongoDB, and GCP Dataflow jobs behind its sales intelligence data.

I write about shipping products to production, AI tooling in the real world, and the lessons that don't make it into tutorials.
"""

# Collection to display on home
homeCollectionTitle = 'Posts'
homeCollection = 'posts'

# Lists parameters
paginationSize = 100
listSummaries = true
listDateFormat = '2 Jan 2006'

# Breadcrumbs
breadcrumbs = true

# Social icons
